<style>
  * {
    box-sizing: border-box;
  }

  .wr {
    padding: 1.5rem 0;
    font-family: var(--font-sans, sans-serif);
  }

  .hd {
    display: flex;
    justify-content: center;
    margin-bottom: 1.25rem;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--color-text-secondary);
    padding: 5px 18px;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 999px;
    background: var(--color-background-secondary);
  }

  .sd {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-text-tertiary);
    flex-shrink: 0;
    transition: background 0.4s;
  }

  .sd.scanning {
    background: var(--color-text-info);
    animation: blink 1.1s ease-in-out infinite;
  }

  .sd.done {
    background: var(--color-text-success);
    animation: none;
  }

  @keyframes blink {

    0%,
    100% {
      opacity: 1
    }

    50% {
      opacity: .15
    }
  }

  .gr {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
    align-items: start;
  }

  .doc {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg, 12px);
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
  }

  .dh {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    margin-bottom: 14px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
  }

  .dn {
    font-size: 12px;
    color: var(--color-text-secondary);
  }

  .dbadge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--color-background-danger);
    color: var(--color-text-danger);
  }

  .dl {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .dli {
    height: 8px;
    border-radius: 4px;
    background: var(--color-background-tertiary);
    transition: background 0.3s, transform 0.2s;
  }

  .dli.fl {
    transform: scaleY(1.3);
    transform-origin: left center;
  }

  .dli.fe {
    background: var(--color-background-info);
  }

  .dli.fd {
    background: var(--color-background-success);
  }

  .dli.fk {
    background: var(--color-background-warning);
  }

  .bm {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--color-text-info);
    z-index: 5;
    pointer-events: none;
    display: none;
    transition: top 0.2s linear, opacity 0.3s;
  }

  .bg {
    position: absolute;
    left: 0;
    right: 0;
    height: 32px;
    top: -15px;
    background: var(--color-background-info);
    opacity: 0.45;
    pointer-events: none;
  }

  .ap {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ac {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md, 8px);
    padding: 10px 12px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.35s, transform 0.35s;
  }

  .ac.show {
    opacity: 1;
    transform: translateY(0);
  }

  .al {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .ald {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .alt {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .at {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .atg {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    opacity: 0;
    transform: scale(.85);
    transition: opacity .2s, transform .2s;
  }

  .atg.show {
    opacity: 1;
    transform: scale(1);
  }

  .te .ald {
    background: var(--color-text-info);
  }

  .te .alt {
    color: var(--color-text-info);
  }

  .te .atg {
    background: var(--color-background-info);
    color: var(--color-text-info);
  }

  .td .ald {
    background: var(--color-text-success);
  }

  .td .alt {
    color: var(--color-text-success);
  }

  .td .atg {
    background: var(--color-background-success);
    color: var(--color-text-success);
  }

  .tk .ald {
    background: var(--color-text-warning);
  }

  .tk .alt {
    color: var(--color-text-warning);
  }

  .tk .atg {
    background: var(--color-background-warning);
    color: var(--color-text-warning);
  }

  .tsum .ald {
    background: var(--color-text-success);
  }

  .tsum .alt {
    color: var(--color-text-success);
  }

  .cfr {
    width: 100%;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .cfl {
    font-size: 11px;
    color: var(--color-text-secondary);
    flex-shrink: 0;
  }

  .cfb {
    flex: 1;
    height: 4px;
    background: var(--color-background-tertiary);
    border-radius: 2px;
    overflow: hidden;
  }

  .cff {
    height: 100%;
    background: var(--color-text-success);
    border-radius: 2px;
    width: 0%;
    transition: width .9s .3s;
  }

  .cfp {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-success);
    min-width: 30px;
    text-align: right;
  }

  .pr {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pb {
    flex: 1;
    height: 3px;
    background: var(--color-background-tertiary);
    border-radius: 2px;
    overflow: hidden;
  }

  .pf {
    height: 100%;
    background: var(--color-text-info);
    border-radius: 2px;
    width: 0%;
    transition: width .35s;
  }

  .pp {
    font-size: 12px;
    color: var(--color-text-secondary);
    min-width: 36px;
    text-align: right;
  }
</style>

<div class="wr">
  <h2 class="sr-only">Animação de IA lendo e analisando um documento PDF, extraindo entidades, datas e termos-chave em
    tempo real</h2>
  <div class="hd">
    <div class="pill">
      <div class="sd" id="sd"></div>
      <span id="st">Aguardando documento…</span>
    </div>
  </div>
  <div class="gr">
    <div class="doc" id="doc">
      <div class="dh">
        <i class="ti ti-file-description" style="font-size:15px;color:var(--color-text-secondary)"
          aria-hidden="true"></i>
        <span class="dn">contrato_servicos.pdf</span>
        <span class="dbadge">PDF</span>
      </div>
      <div class="dl" id="dl"></div>
      <div class="bm" id="bm">
        <div class="bg"></div>
      </div>
    </div>
    <div class="ap" id="ap"></div>
  </div>
  <div class="pr">
    <div class="pb">
      <div class="pf" id="pf"></div>
    </div>
    <div class="pp" id="pp">0%</div>
  </div>
</div>

<script>
  const LN = [
    { w: 88, t: null }, { w: 70, t: 'e' }, { w: 85, t: null }, { w: 52, t: 'd' },
    { w: 92, t: null }, { w: 64, t: null }, { w: 78, t: 'k' }, { w: 56, t: null },
    { w: 88, t: null }, { w: 72, t: 'e' }, { w: 80, t: null }, { w: 74, t: null },
    { w: 60, t: 'd' }, { w: 90, t: null }, { w: 46, t: 'k' }, { w: 86, t: null },
    { w: 76, t: null }, { w: 54, t: null }
  ];

  const CARDS = [
    {
      id: 'e', cls: 'te', lbl: 'Partes identificadas',
      tags: ['João R. Silva', 'EcoClinic Ltda', 'Maria Oliveira', 'Ana Costa'], tl: 1
    },
    {
      id: 'd', cls: 'td', lbl: 'Datas e prazos',
      tags: ['15/03/2024', '01/04/2024', '31/03/2025', '30 dias úteis'], tl: 3
    },
    {
      id: 'k', cls: 'tk', lbl: 'Termos-chave',
      tags: ['Prestação de Serviços', 'R$ 12.500,00', 'Cláusula 7ª', 'Multa 10%'], tl: 6
    },
    { id: 's', cls: 'tsum', lbl: 'Conclusão da análise', tags: [], isConf: true, tl: 14 }
  ];

  const dl = document.getElementById('dl');
  LN.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dli'; d.id = 'li' + i;
    d.style.width = LN[i].w + '%';
    dl.appendChild(d);
  });

  const ap = document.getElementById('ap');
  CARDS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'ac ' + c.cls; d.id = 'ac' + c.id;
    d.innerHTML = `<div class="al"><div class="ald"></div><span class="alt">${c.lbl}</span></div>
    <div class="at">${c.tags.map(t => `<span class="atg">${t}</span>`).join('')}
    ${c.isConf ? `<div class="cfr"><span class="cfl">Confiança</span><div class="cfb"><div class="cff" id="cf"></div></div><span class="cfp" id="cp">0%</span></div>` : ''}</div>`;
    ap.appendChild(d);
  });

  const bm = document.getElementById('bm'), pf = document.getElementById('pf'),
    pp = document.getElementById('pp'), sd = document.getElementById('sd'),
    st = document.getElementById('st'), doc = document.getElementById('doc');
  const delay = ms => new Promise(r => setTimeout(r, ms));

  function setS(txt, cls) { st.textContent = txt; sd.className = 'sd' + (cls ? ' ' + cls : ''); }
  function setP(v) { const r = Math.round(v); pf.style.width = r + '%'; pp.textContent = r + '%'; }

  function showCard(id) {
    const c = document.getElementById('ac' + id); if (!c) return;
    c.classList.add('show');
    c.querySelectorAll('.atg').forEach((t, i) => setTimeout(() => t.classList.add('show'), 160 + i * 140));
    if (id === 's') {
      setTimeout(() => {
        const cf = document.getElementById('cf'), cp = document.getElementById('cp');
        if (cf) cf.style.width = '94%'; if (cp) cp.textContent = '94%';
      }, 600);
    }
  }

  function flash(i) {
    const el = document.getElementById('li' + i); if (!el) return;
    const t = LN[i].t;
    if (t) {
      el.classList.add('fl', 'f' + t);
      setTimeout(() => el.classList.remove('fl', 'f' + t), 520);
    } else {
      el.style.background = 'var(--color-background-secondary)';
      setTimeout(() => el.style.background = '', 320);
    }
  }

  const trg = {}; CARDS.forEach(c => { trg[c.tl] = c.id; });

  async function run() {
    document.querySelectorAll('.ac').forEach(c => c.classList.remove('show'));
    document.querySelectorAll('.atg').forEach(t => t.classList.remove('show'));
    document.querySelectorAll('.dli').forEach((l, i) => { l.className = 'dli'; l.style.background = ''; l.style.width = LN[i].w + '%'; });
    const cf = document.getElementById('cf'), cp = document.getElementById('cp');
    if (cf) cf.style.width = '0%'; if (cp) cp.textContent = '0%';
    bm.style.opacity = '1'; bm.style.display = 'none';
    setP(0); setS('Aguardando documento…');

    await delay(800);
    setS('Lendo documento…', 'scanning');

    const dr = doc.getBoundingClientRect();
    const fe = document.getElementById('li0').getBoundingClientRect();
    bm.style.transition = 'none';
    bm.style.top = (fe.top - dr.top + fe.height / 2 - 1) + 'px';
    bm.style.display = 'block';

    for (let i = 0; i < LN.length; i++) {
      if (i > 0) {
        const lr = document.getElementById('li' + i).getBoundingClientRect();
        bm.style.transition = 'top 0.2s linear';
        bm.style.top = (lr.top - dr.top + lr.height / 2 - 1) + 'px';
      }
      flash(i);
      setP((i + 1) / LN.length * 92);
      if (trg[i]) { const cid = trg[i]; setTimeout(() => showCard(cid), 260); }
      await delay(230);
    }

    await delay(250);
    setP(100);
    setS('Análise concluída!', 'done');
    bm.style.transition = 'top 0.2s linear, opacity 0.4s';
    bm.style.opacity = '0';
    await delay(400);
    bm.style.display = 'none';

    await delay(3200);
    run();
  }

  run();
</script>
